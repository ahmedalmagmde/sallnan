function trs(s){const D={...DICT,...S.tr},t=s.trim();if(!/[\u0600-\u06FF]/.test(t))return s;let m;const R=x=>s.replace(t,()=>x);if(D[t])return R(D[t]);for(const[r,f]of RX)if(m=t.match(r))return R(f(m));if(m=t.match(/^(.*) \((\d+)\)$/))return R(trs(m[1])+' ('+m[2]+')');if(m=t.match(/^(\d+)× (.+)$/))return R(m[1]+'× '+trs(m[2]));if(t.includes('، '))return R(t.split('، ').map(trs).join(', '));if(m=t.match(/^([^\u0600-\u06FF]+)(.+)$/))return R(m[1]+trs(m[2]));return s}
